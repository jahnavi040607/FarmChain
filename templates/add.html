{% extends "base.html" %}{% block title %}Add Product | FarmChain{% endblock %}{% block content %}
<p class="eyebrow">FARMER PORTAL</p><h1 class="page-title">Register a product</h1><p class="muted">Add harvest details to create a traceable product record.</p>
<form class="panel formgrid" method="post"><label>Product name *<input name="name" required placeholder="e.g. Organic Tomatoes"></label><label>Farmer name *<input name="farmer" required placeholder="Your name"></label><label>Farm location *<input name="location" required placeholder="Village, district"></label><label>Category *<select name="category" required><option value="">Choose category</option><option>Vegetables</option><option>Fruits</option><option>Grains</option><option>Dairy</option><option>Other</option></select></label><label>Harvest date *<input type="date" name="harvest_date" required></label><label class="wide">Notes / quality observations<textarea name="notes" rows="4" placeholder="Fresh, organic, storage conditions..."></textarea></label><div class="wide"><button class="btn">Create traceability record</button></div></form>{% endblock %}
